# Run from the repository root, or set ORAL_MEMORY_ROOT to that absolute path.
# One MCP process is bound to one host-selected patient and actor role.
- insert:
    - id: memory-oral-leukoplakia
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: oral_memory
        transport: stdio
        command: !!js process.env.ORAL_MEMORY_PYTHON?.trim() || 'python3'
        args:
          - !!js process.getBuiltinModule('node:path').resolve(process.env.ORAL_MEMORY_ROOT?.trim() || process.cwd(), 'integrations/oral-memory/server.py')
        cwd: !!js process.env.ORAL_MEMORY_ROOT?.trim() || process.cwd()
        failOnStartupError: true
        env:
          ORAL_MEMORY_DB: !!js process.env.ORAL_MEMORY_DB?.trim() || process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh', 'oral-memory', 'memory.sqlite3')
          ORAL_MEMORY_CASE_DRIVEN: '1'
          ORAL_MEMORY_PATIENT_ID: !!js process.env.ORAL_MEMORY_PATIENT_ID?.trim() || ''
          ORAL_MEMORY_ACTOR_ROLE: !!js process.env.ORAL_MEMORY_ACTOR_ROLE?.trim() || 'patient'
          ORAL_MEMORY_ENCOUNTER_ID: !!js process.env.ORAL_MEMORY_ENCOUNTER_ID?.trim() || 'current'
          ORAL_MEMORY_QUESTIONNAIRE: !!js process.env.ORAL_MEMORY_QUESTIONNAIRE?.trim() || process.getBuiltinModule('node:path').resolve(process.env.ORAL_MEMORY_ROOT?.trim() || process.cwd(), 'integrations/oral-memory/questionnaire.json')
          ORAL_MEMORY_LOW_FREQUENCY_MIN_EXPOSURES: !!js process.env.ORAL_MEMORY_LOW_FREQUENCY_MIN_EXPOSURES || '10'
          ORAL_MEMORY_LOW_FREQUENCY_THRESHOLD: !!js process.env.ORAL_MEMORY_LOW_FREQUENCY_THRESHOLD || '0.3'
          ORAL_MEMORY_LOW_FREQUENCY_MULTIPLIER: !!js process.env.ORAL_MEMORY_LOW_FREQUENCY_MULTIPLIER || '0.2'
          ORAL_MEMORY_EXPLORATION_RATE: !!js process.env.ORAL_MEMORY_EXPLORATION_RATE || '0.1'
          ORAL_MEMORY_UTILITY_FLOOR: !!js process.env.ORAL_MEMORY_UTILITY_FLOOR || '0.05'
          ORAL_MEMORY_UNUSED_PENALTY: !!js process.env.ORAL_MEMORY_UNUSED_PENALTY || '0.1'
          ORAL_MEMORY_DECAY_STEP: !!js process.env.ORAL_MEMORY_DECAY_STEP || '0.1'
          ORAL_MEMORY_DECAY_FLOOR: !!js process.env.ORAL_MEMORY_DECAY_FLOOR || '0'
          ORAL_MEMORY_MAX_QUESTION_ATTEMPTS: !!js process.env.ORAL_MEMORY_MAX_QUESTION_ATTEMPTS || '2'
          ORAL_MEMORY_MIN_PHENOTYPE_SCORE: !!js process.env.ORAL_MEMORY_MIN_PHENOTYPE_SCORE || '0.2'
          ORAL_MEMORY_RECALL_LIMIT: !!js process.env.ORAL_MEMORY_RECALL_LIMIT || '100'
          ORAL_MEMORY_PER_CATEGORY_LIMIT: !!js process.env.ORAL_MEMORY_PER_CATEGORY_LIMIT || '10'
          ORAL_MEMORY_MAX_SCAN_RECORDS: !!js process.env.ORAL_MEMORY_MAX_SCAN_RECORDS || '10000'
          ORAL_MEMORY_BUSY_TIMEOUT_MS: !!js process.env.ORAL_MEMORY_BUSY_TIMEOUT_MS || '5000'
          ORAL_MEMORY_FIELD_WEIGHTS: !!js process.env.ORAL_MEMORY_FIELD_WEIGHTS || '{}'
