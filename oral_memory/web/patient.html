<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedDental · 口腔白斑辅助诊断</title><link rel="stylesheet" href="/patient.css"></head>
<body><main>
<header><div><span class="eyebrow">MEDDENTAL / 口腔白斑</span><h1>从完整的描述开始</h1><p>逐步补充白斑信息，保留既往经历，交由医生复核。</p></div><a href="/doctor">医生工作台 ↗</a></header>
<section class="connection"><label>就诊编号<input id="encounter" value="current" maxlength="100"></label><button id="load">读取 / 新建就诊</button><span id="patient"></span></section>
<p id="status" role="status">正在读取本地病例…</p>
<div class="columns"><section class="card conversation"><div class="section-title"><h2>患者交流</h2><span id="model-state"></span></div>
<div id="messages" aria-live="polite"></div><p class="question" id="question"></p>
<form id="turn-form"><div class="form-row"><label>交流方式<select id="mode"><option value="guided">逐项问询</option><option value="chat">自然语言交流</option></select></label><label id="field-label">当前补充项<select id="field"></select></label><label id="answer-status-label">信息状态<select id="answer-status"><option value="known">已明确</option><option value="uncertain">记不清 / 不确定</option><option value="denied">明确否认</option><option value="deferred">暂缓回答</option></select></label></div>
<label for="message">您的描述</label><textarea id="message" rows="4" maxlength="12000" placeholder="请描述您知道的情况；不确定的内容可以直接说明。" required></textarea><button id="send" type="submit">保存并继续</button></form><p class="muted">系统整理问询与参考证据，最终诊断由医生确认。</p>
<details><summary>补充白斑外观与邻近牙位</summary><p class="muted">仅填写已知外观。记忆保存文字表征，不保存图片或图像向量。</p><form id="phenotype-form"><div class="form-row"><label>位置<input id="site" placeholder="例如：左颊黏膜"></label><label>侧别<select id="side"><option value="unknown">未知</option><option value="left">左侧</option><option value="right">右侧</option><option value="midline">中线</option><option value="bilateral">双侧</option></select></label><label>邻近牙位<input id="tooth_positions" placeholder="仅填已知编号，以逗号分隔"></label></div><div class="form-row"><label>颜色<input id="color"></label><label>形态<input id="morphology"></label><label>表面<input id="surface"></label></div><div class="form-row"><label>边界<input id="border"></label><label>范围<input id="extent"></label><label>尺寸描述<input id="size_description"></label></div><button id="save-phenotype" type="submit">保存表征</button></form></details>
</section><aside class="card"><div class="section-title"><h2>病例摘要</h2><span id="revision"></span></div><div id="fields"></div><h3>医生追问</h3><div id="doctor-questions"></div><h3>已确认诊断</h3><div id="diagnoses"></div><details><summary>本轮参考记忆</summary><pre id="memory">尚未检索</pre></details></aside></div>
</main><script src="/patient.js"></script></body></html>
